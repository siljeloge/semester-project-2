<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Edit your MyBid profile, update your bio, avatar, and banner image."
    />
    <link rel="icon" type="image/png" href="./assets/mybid-favicon.png" />
    <title>Edit Profile | MyBid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./dist/css/styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <nav
        class="navbar navbar-expand-lg bg-white"
        aria-label="Main navigation"
      >
        <div class="container">
          <a class="navbar-brand" href="./index.html"> mybid<span>.</span> </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNav"
            aria-controls="mainNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav"></div>
        </div>
      </nav>
    </header>
    <!-- Edit profile -->
    <main class="listing-form-page">
      <div class="container py-5">
        <div class="listing-form-wrapper">
          <div class="mb-4">
            <h1>Edit profile</h1>
            <p>Update your profile information.</p>
          </div>
          <form id="editProfileForm">
            <!-- Avatar -->
            <div class="mb-4">
              <label for="avatar" class="form-label"> Avatar URL </label>
              <input
                type="url"
                class="form-control"
                id="avatar"
                name="avatar"
                maxlength="300"
                placeholder="https://example.com/avatar.jpg"
                aria-describedby="avatarHelp"
              />
              <div class="form-text" id="avatarHelp">
                Enter a new image URL to change your avatar. Leave blank to keep
                your current avatar.
              </div>
            </div>
            <!-- Banner -->
            <div class="mb-4">
              <label for="banner" class="form-label"> Banner URL </label>
              <input
                type="url"
                class="form-control"
                id="banner"
                name="banner"
                maxlength="300"
                placeholder="https://example.com/banner.jpg"
                aria-describedby="bannerHelp"
              />
              <div class="form-text" id="bannerHelp">
                Enter a new image URL to change your banner. Leave blank to keep
                your current banner.
              </div>
            </div>
            <!-- Bio -->
            <div class="mb-4">
              <label for="bio" class="form-label"> Bio </label>
              <textarea
                class="form-control"
                id="bio"
                name="bio"
                rows="5"
                maxlength="160"
                placeholder="Tell other users a little about yourself."
                aria-describedby="bioHelp"
              ></textarea>
              <div class="form-text" id="bioHelp">Maximum 160 characters.</div>
            </div>
            <!-- Feedback -->
            <div id="profileMessage" class="mb-4" aria-live="polite"></div>
            <!-- Actions -->
            <div class="d-flex justify-content-end gap-3">
              <a href="./profile.html" class="btn btn-outline-primary">
                Cancel
              </a>
              <button type="submit" class="btn btn-primary">
                Save changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <!-- Footer -->
    <footer class="site-footer">
      <div class="container">
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-4"
        >
          <a class="footer-brand" href="./index.html"> mybid<span>.</span> </a>
          <nav
            class="footer-nav"
            id="footerNav"
            aria-label="Footer navigation"
          ></nav>
        </div>
        <p class="copyright text-center mb-0">© 2026 MyBid</p>
      </div>
    </footer>
    <script type="module" src="./src/js/bootstrap.js"></script>
    <script type="module" src="./src/js/edit-profile.js"></script>
    <script type="module" src="./src/js/ui/header.js"></script>
    <script type="module" src="./src/js/ui/footer.js"></script>
  </body>
</html>
