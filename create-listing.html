<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/mybid-favicon.png" />
    <title>Create Listing | MyBid</title>

    <link rel="stylesheet" href="./dist/css/styles.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <nav class="navbar navbar-expand-md bg-white border-bottom">
        <div class="container">
          <a class="navbar-brand" href="./index.html"> mybid<span>.</span> </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNav"
            aria-controls="mainNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="mainNav"></div>
        </div>
      </nav>
    </header>

    <!-- Create listing -->
    <main class="listing-form-page">
      <div class="container py-5">
        <div class="listing-form-wrapper">
          <div class="mb-4">
            <h1>Create listing</h1>
            <p>Add the details for the item you want to sell.</p>
          </div>

          <form id="createListingForm">
            <!-- Title -->
            <div class="mb-4">
              <label for="title" class="form-label"> Title </label>

              <input
                type="text"
                class="form-control"
                id="title"
                name="title"
                required
              />
            </div>

            <!-- Description -->
            <div class="mb-4">
              <label for="description" class="form-label"> Description </label>

              <textarea
                class="form-control"
                id="description"
                name="description"
                rows="5"
              ></textarea>
            </div>

            <!-- Deadline -->
            <div class="mb-4">
              <label for="endsAt" class="form-label"> Deadline </label>

              <input
                type="datetime-local"
                class="form-control"
                id="endsAt"
                name="endsAt"
                required
              />
            </div>

            <!-- Images -->
            <div class="mb-4">
              <label for="media" class="form-label"> Images </label>

              <div id="mediaInputs">
                <div class="media-input mb-2">
                  <input
                    type="url"
                    class="form-control"
                    id="media"
                    name="media"
                    placeholder="https://example.com/image.jpg"
                    maxlength="300"
                  />
                </div>
              </div>

              <div class="form-text mb-2">Add image URLs for your item.</div>

              <button
                type="button"
                class="btn btn-outline-primary btn-sm"
                id="addImageBtn"
              >
                + Add another image
              </button>
            </div>

            <!-- Tags -->
            <div class="mb-4">
              <label for="tags" class="form-label"> Tags </label>

              <input
                type="text"
                class="form-control"
                id="tags"
                name="tags"
                placeholder="electronics, camera, vintage"
              />

              <div class="form-text">Separate tags with commas.</div>
            </div>

            <!-- Message -->
            <div id="listingMessage" class="mb-4" role="alert"></div>

            <!-- Buttons -->
            <div class="d-flex justify-content-end gap-3">
              <a href="./profile.html" class="btn btn-outline-primary">
                Cancel
              </a>

              <button type="submit" class="btn btn-primary">
                Create listing
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container">
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-4"
        >
          <a class="footer-brand" href="./index.html"> mybid<span>.</span> </a>

          <nav
            class="footer-nav"
            id="footerNav"
            aria-label="Footer navigation"
          ></nav>
        </div>

        <p class="copyright text-center mb-0">© 2026 MyBid</p>
      </div>
    </footer>
    <script type="module" src="./src/js/bootstrap.js"></script>
    <script type="module" src="./src/js/create-listing.js"></script>
    <script type="module" src="./src/js/ui/header.js"></script>
    <script type="module" src="./src/js/ui/footer.js"></script>
  </body>
</html>
