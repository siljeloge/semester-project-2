<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="./assets/mybid-favicon.png" />

    <title>MyBid | Student Auctions</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./dist/css/styles.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <nav class="navbar navbar-expand-md bg-white">
        <div class="container">
          <a class="navbar-brand" href="./index.html"> mybid<span>.</span> </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNav"
            aria-controls="mainNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-md-center gap-md-3">
              <li class="nav-item">
                <a class="nav-link" href="./index.html"> Browse </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="./login.html"> Log in </a>
              </li>

              <li class="nav-item">
                <a class="btn btn-primary" href="./register.html"> Sign up </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- Hero -->
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <h1>
              Find it. Bid on it.<br />
              Make it yours.
            </h1>

            <p>
              Discover unique items listed by fellow students
              <br class="d-none d-md-block" />
              and find your next great deal.
            </p>

            <form class="hero-search" role="search">
              <label for="search" class="visually-hidden">
                Search listings
              </label>

              <input
                id="search"
                class="form-control"
                type="search"
                placeholder="Search by title or tags..."
              />

              <button class="btn btn-primary" type="submit">Search</button>
            </form>
          </div>
        </div>
      </section>

      <!-- Ending soon -->
      <section class="ending-soon py-5">
        <div class="container">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Ending soon</h2>

            <a href="#browse" class="section-link"> View all </a>
          </div>

          <div class="row g-4" id="endingSoonListings"></div>
        </div>
      </section>

      <!-- Browse listings -->
      <section class="browse-listings py-5" id="browse">
        <div class="container">
          <h2 class="mb-4">Browse listings</h2>

          <div
            class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4"
          >
            <!-- Filters -->
            <div class="d-flex flex-wrap gap-2" id="listingFilters">
              <button
                class="btn filter-btn active"
                type="button"
                data-filter="all"
                aria-pressed="true"
              >
                All listings
              </button>

              <button
                class="btn filter-btn"
                type="button"
                data-filter="has-bids"
                aria-pressed="false"
              >
                Has bids
              </button>

              <button
                class="btn filter-btn"
                type="button"
                data-filter="no-bids"
                aria-pressed="false"
              >
                No bids yet
              </button>
            </div>

            <!-- Sort -->
            <div class="d-flex align-items-center gap-2">
              <label for="sort" class="sort-label"> Sort by </label>

              <select id="sort" class="form-select sort-select">
                <option value="newest">Newest</option>

                <option value="ending-soon">Ending soon</option>

                <option value="oldest">Oldest</option>
              </select>
            </div>
          </div>

          <!-- Listings -->
          <div class="row g-4" id="listings"></div>

          <!-- Load more -->
          <div class="text-center mt-5">
            <button
              class="btn btn-outline-primary px-4"
              type="button"
              id="loadMoreBtn"
            >
              Load more
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container">
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-4"
        >
          <a class="footer-brand" href="./index.html"> mybid<span>.</span> </a>

          <nav
            class="footer-nav"
            id="footerNav"
            aria-label="Footer navigation"
          ></nav>
        </div>

        <p class="copyright text-center mb-0">© 2026 MyBid</p>
      </div>
    </footer>
    <script type="module" src="./src/js/bootstrap.js"></script>
    <script type="module" src="./src/js/index.js"></script>
    <script type="module" src="./src/js/ui/footer.js"></script>
    <script type="module" src="./src/js/ui/header.js"></script>
  </body>
</html>
