<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View your MyBid profile, manage your auction listings, and track your bids."
    />
    <link rel="icon" type="image/png" href="./assets/mybid-favicon.png" />
    <title>My Profile | MyBid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./dist/css/styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <nav
        class="navbar navbar-expand-lg bg-white"
        aria-label="Main navigation"
      >
        <div class="container">
          <a class="navbar-brand" href="./index.html"> mybid<span>.</span> </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNav"
            aria-controls="mainNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav"></div>
        </div>
      </nav>
    </header>
    <!-- Profile -->
    <main class="profile-page">
      <div class="container py-5">
        <div id="profile">
          <p role="status">Loading profile...</p>
        </div>
      </div>
    </main>
    <!-- Footer -->
    <footer class="site-footer">
      <div class="container">
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-4"
        >
          <a class="footer-brand" href="./index.html"> mybid<span>.</span> </a>
          <nav
            class="footer-nav"
            id="footerNav"
            aria-label="Footer navigation"
          ></nav>
        </div>
        <p class="copyright text-center mb-0">© 2026 MyBid</p>
      </div>
    </footer>
    <script type="module" src="./src/js/profile.js"></script>
    <script type="module" src="./src/js/bootstrap.js"></script>
    <script type="module" src="./src/js/ui/header.js"></script>
    <script type="module" src="./src/js/ui/footer.js"></script>
  </body>
</html>
